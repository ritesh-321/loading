<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nepal Hotspot Loading...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            margin: 0;
            flex-direction: column;
        }

        #loading {
            text-align: center;
        }

        #loading h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #61dafb;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #444;
            border-top: 6px solid #61dafb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }
    </style>
</head>

<body>
    <div id="loading">
        <h1>Starting up Nepal Hotspot...</h1>
        <div class="spinner"></div>
    </div>

<script>
    const BACKEND_URL = "https://project-n-se6h.onrender.com";
    const HEALTH_URL = `${BACKEND_URL}/health`;

    // Retry every 5 seconds while server is sleeping
    const WAKEUP_CHECK_INTERVAL = 5000;

    // Keep alive ping every 5 minutes
    const KEEP_ALIVE_INTERVAL = 5 * 60 * 1000;

    let serverAwake = false;

    async function wakeUpServer() {
        try {
            const response = await fetch(HEALTH_URL, {
                method: "GET",
                cache: "no-cache"
            });

            console.log(
                "Ping:",
                new Date().toLocaleTimeString(),
                "Status:",
                response.status
            );

            if (response.ok) {
                serverAwake = true;

                document.querySelector("h1").innerText =
                    "Server Started ✅ Redirecting...";

                // Start keep alive system
                startKeepAlive();

                // Redirect after short delay
                setTimeout(() => {
                    window.location.href = BACKEND_URL;
                }, 2000);

            } else {
                retryWakeup();
            }

        } catch (error) {
            console.log("Server sleeping...");
            retryWakeup();
        }
    }

    function retryWakeup() {
        document.querySelector("h1").innerText =
            "Waking Server... Please Wait ⏳";

        setTimeout(wakeUpServer, WAKEUP_CHECK_INTERVAL);
    }

    function startKeepAlive() {
        setInterval(async () => {
            try {
                await fetch(HEALTH_URL);

                console.log(
                    "Keep Alive Ping:",
                    new Date().toLocaleTimeString()
                );

            } catch (err) {
                console.log("Keep alive failed");
            }
        }, KEEP_ALIVE_INTERVAL);
    }

    // Start wakeup process immediately
    wakeUpServer();
</script>

</body>

</html>
